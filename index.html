<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Design Index · 设计灵感网站</title>
<meta name="description" content="设计灵感网站分类导航与个人收藏索引" />
<style>
:root{--bg:#f4f4f1;--card:#fff;--text:#161616;--muted:#72726d;--line:#deded8;--accent:#171717;--soft:#ecece7;--shadow:0 10px 30px rgba(0,0,0,.055);--radius:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"SF Pro Text","PingFang SC","Microsoft YaHei",Arial,sans-serif}button,input,select,textarea{font:inherit}.shell{max-width:1480px;margin:auto;padding:24px 30px 56px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:38px}.brand{display:flex;align-items:center;gap:12px;font-weight:760;letter-spacing:-.02em}.mark{width:34px;height:34px;border-radius:10px;background:#111;display:grid;place-items:center;color:#fff;font-size:13px}.top-actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;cursor:pointer;transition:.18s;white-space:nowrap}.btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.05)}.btn.primary{background:#111;color:#fff;border-color:#111}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:42px;align-items:end;margin-bottom:30px}.hero h1{font-size:clamp(42px,6vw,86px);letter-spacing:-.065em;line-height:.9;margin:0;max-width:900px}.hero p{color:var(--muted);line-height:1.72;margin:0 0 6px;max-width:520px;font-size:15px}.stats{display:flex;gap:30px;margin:34px 0 0}.stat strong{font-size:26px;display:block;letter-spacing:-.04em}.stat span{font-size:12px;color:var(--muted)}.workspace{display:grid;grid-template-columns:235px 1fr;gap:24px;align-items:start}.sidebar{position:sticky;top:20px;background:#ecece7;border-radius:16px;padding:14px}.side-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#81817a;padding:8px 10px 10px}.navbtn{width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;color:#4e4e49}.navbtn:hover{background:rgba(255,255,255,.55)}.navbtn.active{background:#fff;color:#111;font-weight:650;box-shadow:0 1px 0 rgba(0,0,0,.03)}.count{color:#999;font-size:12px}.main{min-width:0}.controls{display:grid;grid-template-columns:minmax(280px,1fr) auto;gap:12px;margin-bottom:18px}.search{position:relative}.search input{width:100%;height:48px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:0 15px 0 43px;outline:none}.search input:focus{border-color:#aaa;box-shadow:0 0 0 3px rgba(0,0,0,.035)}.search svg{position:absolute;left:15px;top:15px;color:#777}.viewbar{display:flex;gap:8px}.viewbtn{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:white;cursor:pointer}.viewbtn.active{background:#111;color:white;border-color:#111}.meta-row{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:5px 2px 16px;color:var(--muted);font-size:13px}.sort{border:0;background:transparent;color:var(--muted);outline:none}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid.list{grid-template-columns:1fr}.card{background:var(--card);border:1px solid #e8e8e3;border-radius:var(--radius);padding:18px;min-height:190px;display:flex;flex-direction:column;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.015);transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d8d8d1}.list .card{min-height:0;display:grid;grid-template-columns:52px minmax(180px,1fr) 1.3fr auto;gap:18px;align-items:center}.icon{width:45px;height:45px;border-radius:13px;background:#f0f0eb;display:grid;place-items:center;font-weight:750;font-size:15px;text-transform:uppercase;overflow:hidden;flex:none}.card-top{display:flex;gap:13px;align-items:flex-start}.title-wrap{min-width:0}.card h3{font-size:16px;letter-spacing:-.02em;margin:1px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.domain{color:#8a8a84;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.desc{color:#5e5e58;font-size:13px;line-height:1.55;margin:16px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.list .desc{margin:0;-webkit-line-clamp:2}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}.tag{padding:5px 8px;background:#f2f2ed;border-radius:7px;color:#686862;font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag.dark{background:#1d1d1d;color:#fff}.go{position:absolute;right:16px;top:16px;width:35px;height:35px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;text-decoration:none;color:#111}.go:hover{background:#111;color:#fff;border-color:#111}.list .go{position:static}.custom-badge{font-size:10px;color:#777}.empty{padding:70px 20px;text-align:center;color:#777;background:#fff;border:1px dashed #d3d3cc;border-radius:18px}.overlay{position:fixed;inset:0;background:rgba(20,20,20,.42);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.overlay.open{display:flex}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 30px 100px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal h2{font-size:24px;letter-spacing:-.04em;margin:0}.close{border:0;background:#f0f0eb;width:35px;height:35px;border-radius:10px;cursor:pointer}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#666}.field input,.field select,.field textarea{border:1px solid #dddcd6;border-radius:10px;padding:11px 12px;outline:none;background:#fff}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#999}.modal-foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.danger{color:#a12626}.detail-grid{display:grid;grid-template-columns:130px 1fr;gap:10px 20px;font-size:13px;line-height:1.55}.detail-grid dt{color:#888}.detail-grid dd{margin:0}.detail-link{display:inline-block;margin-top:20px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:#111;color:#fff;border-radius:11px;padding:11px 16px;font-size:13px;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}.footer{margin:50px 0 0 260px;color:#888;font-size:12px;line-height:1.7}.kbd{border:1px solid #ccc;border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:#fff;font-size:10px}.file-input{display:none}@media(max-width:1050px){.hero{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:4px}.side-title{display:none}.navbtn{width:auto;flex:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.footer{margin-left:0}.list .card{grid-template-columns:48px 1fr auto}.list .desc{display:none}}@media(max-width:680px){.shell{padding:18px 16px 40px}.topbar{align-items:flex-start}.brand span:last-child{display:none}.hero h1{font-size:48px}.stats{gap:18px}.controls{grid-template-columns:1fr}.viewbar{display:none}.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top-actions .btn:not(.primary){display:none}.detail-grid{grid-template-columns:1fr}.detail-grid dt{margin-top:8px}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar"><div class="brand"><span class="mark">DI</span><span>Design Inspiration Index</span></div><div class="top-actions"><button class="btn" id="exportBtn">导出备份</button><label class="btn" for="importFile">导入备份</label><input class="file-input" type="file" id="importFile" accept="application/json"><button class="btn primary" id="addBtn">＋ 新增网址</button></div></header>
  <section class="hero"><div><h1>Design inspiration,<br>organized.</h1><div class="stats"><div class="stat"><strong id="statInsp">0</strong><span>灵感网址</span></div><div class="stat"><strong id="statCats">0</strong><span>分类</span></div></div></div><p>把散落在表格里的设计灵感网站，整理成一个可以搜索、分类浏览并持续增长的个人灵感索引。后续新增的网址保存在当前浏览器，也可以随时导出 JSON 备份。</p></section>
  <div class="workspace">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main"><div class="controls"><div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" placeholder="搜索网站名称、描述、域名、标签…  ( / )" /></div><div class="viewbar"><button class="viewbtn active" data-view="grid" aria-label="网格">▦</button><button class="viewbtn" data-view="list" aria-label="列表">☷</button></div></div><div class="meta-row"><span id="resultMeta"></span><select class="sort" id="sort"><option value="default">默认排序</option><option value="name">按名称 A–Z</option></select></div><section class="grid" id="cards"></section></main>
  </div>
  <footer class="footer">数据源：原始 Excel《设计灵感网站》 · 本页可直接双击打开，无需服务器。<br>提示：按 <span class="kbd">/</span> 可快速进入搜索。新增网址保存在当前浏览器；定期导出备份即可迁移到其他电脑。</footer>
</div>
<div class="overlay" id="editOverlay"><div class="modal"><div class="modal-head"><h2 id="formTitle">新增网址</h2><button class="close" data-close="editOverlay">✕</button></div><form id="entryForm"><input type="hidden" id="entryId"><div class="form-grid"><div class="field"><label>分类</label><input id="entryCategory" placeholder="例如：趋势分析 / 品牌设计 / 字体设计"></div><div class="field"><label>标签</label><input id="entryTags" placeholder="例如：包装, 日本, 字体"></div><div class="field full"><label>网站名称 *</label><input id="entryName" required placeholder="网站名称"></div><div class="field full"><label>网址 *</label><input id="entryUrl" required type="url" placeholder="https://..."></div><div class="field full"><label>描述 / 备注</label><textarea id="entryDesc" placeholder="这个网站为什么值得保留？适合寻找什么灵感？"></textarea></div></div><div class="modal-foot"><button type="button" class="btn danger" id="deleteBtn" style="visibility:hidden">删除</button><div><button type="button" class="btn" data-close="editOverlay">取消</button> <button type="submit" class="btn primary">保存</button></div></div></form></div></div>
<div class="overlay" id="detailOverlay"><div class="modal"><div class="modal-head"><h2 id="detailTitle">详情</h2><button class="close" data-close="detailOverlay">✕</button></div><div id="detailBody"></div></div></div>
<div class="toast" id="toast"></div>
<script src="data-1.js"></script>
<script src="data-2.js"></script>
<script src="data-3.js"></script>
<script src="data-4.js"></script>
<script src="data-5.js"></script>
<script>const BASE_DATA={inspiration:window.DESIGN_DATA||[]};</script>
<script>
const LS_KEY='design-inspiration-custom-v2';
let custom=JSON.parse(localStorage.getItem(LS_KEY)||'[]');
let state={category:'全部',query:'',view:'grid',sort:'default'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').toLowerCase().replace(/\s+/g,' ');
function all(){return [...BASE_DATA.inspiration,...custom]}
function categories(){let vals=all().map(x=>x.category||'其他').filter(Boolean);return ['全部',...Array.from(new Set(vals))]}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(custom));render()}
function sidebar(){const el=document.getElementById('sidebar');let h='<div class="side-title">Categories</div>';categories().forEach(c=>{h+=`<button class="navbtn ${state.category===c?'active':''}" data-cat="${esc(c)}"><span>${esc(c)}</span><span class="count">${c==='全部'?all().length:all().filter(x=>(x.category||'其他')===c).length}</span></button>`});el.innerHTML=h;el.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;render()})}
function colorFor(s){let n=0;for(const c of String(s))n=(n*31+c.charCodeAt(0))>>>0;const hues=[28,52,91,152,190,226,272,318];return `hsl(${hues[n%hues.length]} 48% 91%)`}
function searchable(x){return norm(Object.values(x).join(' '))}
function filtered(){let arr=all();if(state.category!=='全部')arr=arr.filter(x=>(x.category||'其他')===state.category);if(state.query){let q=norm(state.query);arr=arr.filter(x=>searchable(x).includes(q))}if(state.sort==='name')arr.sort((a,b)=>(a.name||'').localeCompare(b.name||'','zh'));return arr}
function card(x){let tags=[x.category||'其他'];if(x.custom&&x.tags)tags.push(...x.tags.split(/[,，]/).map(s=>s.trim()).filter(Boolean));let initial=(x.name||x.domain||'?').trim().slice(0,2);let open=x.url?`<a class="go" href="${esc(x.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗</a>`:'';return `<article class="card" data-id="${esc(x.id)}"><div class="card-top"><div class="icon" style="background:${colorFor(x.domain||x.name)}">${esc(initial)}</div><div class="title-wrap"><h3 title="${esc(x.name)}">${esc(x.name||'未命名')}</h3><div class="domain">${esc(x.domain||'设计灵感网站')}</div></div></div><p class="desc">${esc(x.description||'暂无备注')}</p><div class="tags">${tags.slice(0,4).map((t,i)=>`<span class="tag ${i===0?'dark':''}">${esc(t)}</span>`).join('')}${x.custom?'<span class="custom-badge">自定义</span>':''}</div>${open}</article>`}
function renderCards(){const arr=filtered(),el=document.getElementById('cards');el.className='grid '+(state.view==='list'?'list':'');el.innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">没有找到匹配的网站。试试换一个关键词或分类。</div>';document.getElementById('resultMeta').textContent=`${state.category} · ${arr.length} 个网站`;el.querySelectorAll('.card').forEach(c=>c.onclick=e=>{if(!e.target.closest('.go'))detail(c.dataset.id)})}
function render(){document.getElementById('statInsp').textContent=all().length;document.getElementById('statCats').textContent=categories().length-1;if(state.category!=='全部'&&!categories().includes(state.category))state.category='全部';sidebar();renderCards()}
function findItem(id){return all().find(v=>v.id===id)}
function detail(id){const x=findItem(id);if(!x)return;document.getElementById('detailTitle').textContent=x.name||'详情';let pairs=[['分类',x.category],['说明',x.description],['设计评价',x.rating],['标签',x.tags]].filter(p=>p[1]);document.getElementById('detailBody').innerHTML=`<dl class="detail-grid">${pairs.map(p=>`<dt>${esc(p[0])}</dt><dd>${esc(p[1])}</dd>`).join('')}</dl>${x.url?`<a class="btn primary detail-link" href="${esc(x.url)}" target="_blank" rel="noopener">访问网站 ↗</a>`:''}${x.custom?` <button class="btn detail-link" onclick="editCustom('${esc(x.id)}')">编辑</button>`:''}`;openOverlay('detailOverlay')}
function openOverlay(id){document.getElementById(id).classList.add('open')}
function closeOverlay(id){document.getElementById(id).classList.remove('open')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeOverlay(b.dataset.close));document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeOverlay(o.id)}));
function resetForm(){document.getElementById('entryForm').reset();document.getElementById('entryId').value='';document.getElementById('formTitle').textContent='新增网址';document.getElementById('deleteBtn').style.visibility='hidden'}
document.getElementById('addBtn').onclick=()=>{resetForm();openOverlay('editOverlay')}
function editCustom(id){const x=custom.find(v=>v.id===id);if(!x)return;closeOverlay('detailOverlay');document.getElementById('entryId').value=x.id;document.getElementById('entryCategory').value=x.category||'';document.getElementById('entryName').value=x.name||'';document.getElementById('entryUrl').value=x.url||'';document.getElementById('entryDesc').value=x.description||'';document.getElementById('entryTags').value=x.tags||'';document.getElementById('formTitle').textContent='编辑网址';document.getElementById('deleteBtn').style.visibility='visible';openOverlay('editOverlay')}
document.getElementById('entryForm').onsubmit=e=>{e.preventDefault();let id=document.getElementById('entryId').value;let url=document.getElementById('entryUrl').value.trim();let obj={id:id||'c'+Date.now(),custom:true,section:'inspiration',category:document.getElementById('entryCategory').value.trim()||'其他',name:document.getElementById('entryName').value.trim(),url,domain:(()=>{try{return new URL(url).hostname.replace(/^www\./,'')}catch{return''}})(),description:document.getElementById('entryDesc').value.trim(),tags:document.getElementById('entryTags').value.trim()};if(id){custom=custom.map(x=>x.id===id?obj:x)}else custom.unshift(obj);save();closeOverlay('editOverlay');toast(id?'已更新':'已新增')}
document.getElementById('deleteBtn').onclick=()=>{let id=document.getElementById('entryId').value;if(!id)return;if(confirm('确定删除这条自定义网址吗？')){custom=custom.filter(x=>x.id!==id);save();closeOverlay('editOverlay');toast('已删除')}}
document.getElementById('search').addEventListener('input',e=>{state.query=e.target.value;renderCards()});document.getElementById('sort').onchange=e=>{state.sort=e.target.value;renderCards()};document.querySelectorAll('.viewbtn').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;document.querySelectorAll('.viewbtn').forEach(x=>x.classList.toggle('active',x===b));renderCards()});document.addEventListener('keydown',e=>{if(e.key==='/'&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();document.getElementById('search').focus()}if(e.key==='Escape')document.querySelectorAll('.overlay.open').forEach(o=>closeOverlay(o.id))});
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
document.getElementById('exportBtn').onclick=()=>{let payload={app:'Design Inspiration Index',version:2,exportedAt:new Date().toISOString(),custom};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='design-inspiration-backup.json';a.click();URL.revokeObjectURL(a.href);toast('备份已导出')}
document.getElementById('importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());let incoming=Array.isArray(obj)?obj:obj.custom;if(!Array.isArray(incoming))throw new Error();incoming=incoming.filter(x=>!x.section||x.section==='inspiration');let map=new Map(custom.map(x=>[x.id,x]));incoming.forEach(x=>map.set(x.id||('c'+Math.random()),{...x,section:'inspiration',custom:true}));custom=[...map.values()];save();toast(`已导入 ${incoming.length} 条`)}catch{alert('无法识别这个备份文件。')}e.target.value=''}
render();
</script>
</body></html>
